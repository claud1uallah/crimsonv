
[BlackListSettings]
	#Prevents mobs spawners from being placed into cardboard boxes
	BlackListMobSpawners = true

#Auto generated list of tiles registered in Minecraft that can be blocked from use with the box. If a tile does not show up on this list it is already black listed. The reasoning behind blocking tiles is to prevent crashes or unwanted interaction. Such as picking up a piston which can both causes issues and doesn't really matter. Set value to 'true' to disable interaction.
[tile_ban_list]
	"minecraft:shulker_box" = false
